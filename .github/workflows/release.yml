name: release

# Windows-only for now: no macOS to test a build on by hand, and shipping an
# untested build to a paying customer risks a refund with no easy way to
# diagnose or fix it. Re-add a macos-latest matrix entry (see git history
# for the last working version) once real testing on a Mac is possible.
# Push a tag like v0.1.0 to trigger a build; it lands in a draft GitHub
# Release with an unsigned installer attached until the signing secret
# below is added (see docs/distribution.md).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows code signing — set once a code-signing certificate
          # exists (docs/distribution.md); build still succeeds without it,
          # installers just trigger a SmartScreen warning until then.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # License-verification HMAC secret, baked into the binary by
          # build.rs — never a literal in tracked source (src/license.rs).
          BVPR_SIGNING_SECRET: ${{ secrets.BVPR_SIGNING_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Backup Verify ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
