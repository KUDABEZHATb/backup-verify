name: release

# Windows-only for now: no macOS to test a build on by hand, and shipping an
# untested build to a paying customer risks a refund with no easy way to
# diagnose or fix it. Re-add a macos-latest matrix entry (see git history
# for the last working version) once real testing on a Mac is possible.
# Push a tag like v0.1.0 to trigger a build; it lands in a draft GitHub
# Release with an unsigned installer attached until the signing secret
# below is added (see docs/distribution.md).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# The repo's default GITHUB_TOKEN is read-only, so tauri-action can't
# create the draft release without this (v0.2.0's run failed exactly here).
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing (the .sig files next to each bundle), not
          # Windows Authenticode — installers stay unsigned for SmartScreen
          # until a code-signing certificate exists (docs/distribution.md).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Копия верна ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          # GitHub strips non-ASCII from uploaded asset names, which turned
          # «Копия верна_0.3.0_x64-setup.exe» into «_0.3.0_x64-setup.exe» and
          # broke tauri-action's signature lookup, so no latest.json was
          # uploaded and the in-app updater had nothing to fetch.
          assetNamePattern: "kopiya-verna_[version]_[arch][setup][ext]"
          # NSIS runs in the passive install mode the updater is set up for.
          updaterJsonPreferNsis: true
